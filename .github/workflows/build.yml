name: Build EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install customtkinter pyttsx3 openpyxl pygame pyinstaller
      - name: Build EXE
        run: |
          pyinstaller -F -w word_shouter.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordShouter-Windows-EXE
          path: dist/word_shouter.exe
